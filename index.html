const grid = document.getElementById('grid');
const search = document.getElementById('search');
const resultCount = document.getElementById('result-count');
const noResults = document.getElementById('no-results');
const filterBtns = document.querySelectorAll('.filter-btn');

let currentCat = 'all';
let currentQuery = '';

function render() {
  const q = currentQuery.toLowerCase().trim();
  let visible = 0;
  grid.innerHTML = '';

  APPS.forEach(app => {
    const inCat = currentCat === 'all' || app.category === currentCat;
    const inSearch = !q || app.name.toLowerCase().includes(q) || (app.desc || '').toLowerCase().includes(q) || app.category.toLowerCase().includes(q);
    if (inCat && inSearch) {
      visible++;
      const card = document.createElement('a');
      card.href = app.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.className = 'app-card';
      card.role = 'listitem';
      card.innerHTML = `<div class="app-card__cat">${app.category}</div><div class="app-card__name">${esc(app.name)}</div><div class="app-card__desc">${esc(app.desc || '')}</div>`;
      grid.appendChild(card);
    }
  });

  resultCount.textContent = visible;
  noResults.classList.toggle('visible', visible === 0);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

search.addEventListener('input', e => { currentQuery = e.target.value; render(); });

filterBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    filterBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    render();
  });
});

render();
